spring:
  application:
    name: demo-modulith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo_modulith}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

  sql:
    init:
      mode: always
